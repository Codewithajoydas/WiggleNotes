<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(160deg, #0a1128 0%, #0f1c3f 50%, #0a1128 100%);
            -webkit-app-region: drag;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Mulish", -apple-system, sans-serif;
            color: #f4f4f5;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: #4C55E5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.45);
            animation: pulse 1.8s ease-in-out infinite;
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .app-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 12px;
            color: #93c5fd;
            margin-bottom: 32px;
        }

        .loader {
            width: 120px;
            height: 3px;
            background: rgba(96, 165, 250, 0.15);
            border-radius: 999px;
            overflow: hidden;
        }

        .loader-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 999px;
            animation: loading 1.2s ease-in-out infinite;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(350%);
            }
        }
    </style>
</head>
